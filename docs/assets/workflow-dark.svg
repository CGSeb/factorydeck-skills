<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 452" width="1280" height="452" role="img" aria-labelledby="title">
  <title id="title">The workflow: setup-factory once per repository, then write-spec, check-spec, build-feature and retro for each feature. Inside build-feature, each issue goes through a worker, a reviewer, a shipper and a serenity score, then is merged or goes to a person.</title>
  <style>
    .hl{opacity:0;animation-duration:10s;animation-iteration-count:infinite;animation-timing-function:linear}
    .dot{offset-path:path('M388,132 H1126 V48 a18,18 0 0 0 -18,-18 H406 a18,18 0 0 0 -18,18 Z');animation:run 10s linear infinite}
    @keyframes run{0%{offset-distance:0%}17.73%{offset-distance:29.56%}57.73%{offset-distance:29.56%}100%{offset-distance:100%}}
    @media (prefers-reduced-motion: reduce){.hl,.dot{animation:none}.hl{opacity:0}}
  </style>
  <rect width="1280" height="452" rx="24" fill="#0e1413"/>
  <path d="M388,132 H1126 V48 a18,18 0 0 0 -18,-18 H406 a18,18 0 0 0 -18,18 Z" fill="none" stroke="#3a4e4a" stroke-width="2" stroke-dasharray="6 7"/>
  <rect x="607" y="16" width="300" height="28" rx="14" fill="#173a36"/>
  <text x="757" y="35" text-anchor="middle" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#2bb3a3">next feature, with what the run taught</text>
  <g class="dot"><circle r="12" fill="rgba(43,179,163,0.35)"/><circle r="6" fill="#2bb3a3"/></g>
  <g>
      <rect x="34" y="66" width="216" height="132" rx="16" fill="#161e1d" stroke="#2c3a37" stroke-dasharray="5 5"/>
      
      <text x="54" y="98" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#2bb3a3">/setup-factory</text>
      <text x="54" y="128" font-family="'Space Grotesk','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#e6ecea">Once per repo</text>
      <text x="54" y="156" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#97a5a2">your host, agents, labels,</text><text x="54" y="176" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#97a5a2">checks and merge policy</text>
    </g><style>@keyframes hl1{0%{opacity:1}8.00%{opacity:0}92%{opacity:0}100%{opacity:1}}</style><g>
      <rect x="280" y="66" width="216" height="132" rx="16" fill="#161e1d" stroke="#2c3a37" />
      <rect class="hl" style="animation-name:hl1" x="279" y="65" width="218" height="134" rx="17" fill="none" stroke="#2bb3a3" stroke-width="3"/>
      <text x="300" y="98" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#2bb3a3">/write-spec</text>
      <text x="300" y="128" font-family="'Space Grotesk','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#e6ecea">Spec and issue</text>
      <text x="300" y="156" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#97a5a2">testable acceptance</text><text x="300" y="176" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#97a5a2">criteria, dependencies</text>
    </g><style>@keyframes hl2{0%,3.87%{opacity:0}8.87%,16.87%{opacity:1}21.87%,100%{opacity:0}}</style><g>
      <rect x="526" y="66" width="216" height="132" rx="16" fill="#161e1d" stroke="#2c3a37" />
      <rect class="hl" style="animation-name:hl2" x="525" y="65" width="218" height="134" rx="17" fill="none" stroke="#2bb3a3" stroke-width="3"/>
      <text x="546" y="98" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#2bb3a3">/check-spec</text>
      <text x="546" y="128" font-family="'Space Grotesk','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#e6ecea">Settle choices</text>
      <text x="546" y="156" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#97a5a2">every open product</text><text x="546" y="176" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#97a5a2">choice gets decided</text>
    </g><style>@keyframes hl3{0%,12.73%{opacity:0}17.73%,57.73%{opacity:1}62.73%,100%{opacity:0}}</style><g>
      <rect x="772" y="66" width="216" height="132" rx="16" fill="#161e1d" stroke="#2c3a37" />
      <rect class="hl" style="animation-name:hl3" x="771" y="65" width="218" height="134" rx="17" fill="none" stroke="#2bb3a3" stroke-width="3"/>
      <text x="792" y="98" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#2bb3a3">/build-feature</text>
      <text x="792" y="128" font-family="'Space Grotesk','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#e6ecea">Build and merge</text>
      <text x="792" y="156" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#97a5a2">workers, review, a score</text><text x="792" y="176" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#97a5a2">and a merge gate</text>
    </g><style>@keyframes hl4{0%,61.60%{opacity:0}66.60%,74.60%{opacity:1}79.60%,100%{opacity:0}}</style><g>
      <rect x="1018" y="66" width="216" height="132" rx="16" fill="#161e1d" stroke="#2c3a37" />
      <rect class="hl" style="animation-name:hl4" x="1017" y="65" width="218" height="134" rx="17" fill="none" stroke="#2bb3a3" stroke-width="3"/>
      <text x="1038" y="98" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#2bb3a3">/retro</text>
      <text x="1038" y="128" font-family="'Space Grotesk','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#e6ecea">Learn from the run</text>
      <text x="1038" y="156" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#97a5a2">better checks, skills</text><text x="1038" y="176" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#97a5a2">and reviewer rules</text>
    </g>
  <path d="M260,126 L269,132 L260,138" fill="none" stroke="#2bb3a3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M506,126 L515,132 L506,138" fill="none" stroke="#2bb3a3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M752,126 L761,132 L752,138" fill="none" stroke="#2bb3a3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M998,126 L1007,132 L998,138" fill="none" stroke="#2bb3a3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M880,198 V262" stroke="#2bb3a3" stroke-width="2" stroke-dasharray="4 4"/>
  <rect x="34" y="262" width="1212" height="160" rx="18" fill="#121a19" stroke="#2c3a37"/>
  <text x="62" y="302" font-family="'Space Grotesk','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#e6ecea">Inside /build-feature, for each buildable issue</text>
  <text x="1218" y="302" text-anchor="end" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#97a5a2">in parallel, one background agent per issue</text>
  <style>@keyframes ch0{0%,19.13%{opacity:0}20.13%,57.73%{opacity:1}61.73%,100%{opacity:0}}</style><rect x="62" y="332" width="178" height="64" rx="12" fill="#161e1d" stroke="#2c3a37"/><rect class="hl" style="animation-name:ch0" x="62" y="332" width="178" height="64" rx="12" fill="#173a36" stroke="#2bb3a3" stroke-width="2"/><text x="80" y="360" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#e6ecea">worker</text><text x="80" y="381" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#97a5a2">own worktree</text><path d="M252,358 L261,364 L252,370" fill="none" stroke="#3a4e4a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><style>@keyframes ch1{0%,27.13%{opacity:0}28.13%,57.73%{opacity:1}61.73%,100%{opacity:0}}</style><rect x="274" y="332" width="178" height="64" rx="12" fill="#161e1d" stroke="#2c3a37"/><rect class="hl" style="animation-name:ch1" x="274" y="332" width="178" height="64" rx="12" fill="#173a36" stroke="#2bb3a3" stroke-width="2"/><text x="292" y="360" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#e6ecea">reviewer</text><text x="292" y="381" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#97a5a2">fresh eyes</text><path d="M464,358 L473,364 L464,370" fill="none" stroke="#3a4e4a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><style>@keyframes ch2{0%,35.13%{opacity:0}36.13%,57.73%{opacity:1}61.73%,100%{opacity:0}}</style><rect x="486" y="332" width="178" height="64" rx="12" fill="#161e1d" stroke="#2c3a37"/><rect class="hl" style="animation-name:ch2" x="486" y="332" width="178" height="64" rx="12" fill="#173a36" stroke="#2bb3a3" stroke-width="2"/><text x="504" y="360" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#e6ecea">shipper</text><text x="504" y="381" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#97a5a2">PR and CI</text><path d="M676,358 L685,364 L676,370" fill="none" stroke="#3a4e4a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><style>@keyframes ch3{0%,43.13%{opacity:0}44.13%,57.73%{opacity:1}61.73%,100%{opacity:0}}</style><rect x="698" y="332" width="178" height="64" rx="12" fill="#161e1d" stroke="#2c3a37"/><rect class="hl" style="animation-name:ch3" x="698" y="332" width="178" height="64" rx="12" fill="#173a36" stroke="#2bb3a3" stroke-width="2"/><text x="716" y="360" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#e6ecea">serenity</text><text x="716" y="381" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#97a5a2">score and gates</text><style>@keyframes out{0%,47.13%{opacity:0}48.13%,57.73%{opacity:1}61.73%,100%{opacity:0}}</style><path d="M880,364 C910,364 904,338 934,338" fill="none" stroke="#3a4e4a" stroke-width="2"/><path d="M880,364 C910,364 904,390 934,390" fill="none" stroke="#3a4e4a" stroke-width="2"/><rect x="934" y="322" width="150" height="32" rx="16" fill="#15342a"/><rect class="hl" style="animation-name:out" x="934" y="322" width="150" height="32" rx="16" fill="none" stroke="#84dbae" stroke-width="2"/><text x="1009" y="343" text-anchor="middle" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#84dbae">merged</text><rect x="934" y="374" width="150" height="32" rx="16" fill="#3a2a12"/><text x="1009" y="395" text-anchor="middle" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#f1c172">or to a person</text>
</svg>
